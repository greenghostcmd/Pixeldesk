<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width" , initial-scale="1">
    <title>PixelDesk95</title>
    <meta name="description" content="A windows 95 inspired desktop WebOS which lwk looks cool">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <svg class="svg-sprite" aria-hidden="true">
        <symbol id="icon-logo" viewBox="0 0 32 32">
            <path fill="#000" d="M2 3h14v12H2z" />
            <path fill="#f0c000" d="M3 4h12v10H3z" />
            <path fill="#000" d="M16 2h14v13H16z" />
            <path fill="#008080" d="M17 3h12v11H17z" />
            <path fill="#000" d="M2 16h14v13H2z" />
            <path fill="#000080" d="M3 17h12v11H3z" />
            <path fill="#000" d="M16 16h14v13H16z" />
            <path fill="#c00000" d="M17 17h12v11H17z" />
        </symbol>
        <symbol id="icon-computer" viewBox="0 0 32 32">
            <path fill="#000" d="M2 4h28v20H2z" />
            <path fill="#e8e8e8" d="M3 5h26v18H3z" />
            <path fill="#404040" d="M4 6h24v14H4z" />
            <path fill="008080" d="M5 7h22v12H5z" />
            <path fill="#00b0b0" d="M6 8h9v2H6z" />
            <path fill="#000" d="M14 23h4v2h-4z" />
            <path fill="#808080" d="M10 25h12v2H10z" />
            <path fill="#000" d="M7 27h18v3H7z" />
            <path fill="c0c0c0" d="M8 28h16v1H8z" />
            <path fill="#00d000" d="M25 22h2v2h-2z" />
        </symbol>
        <symbol id="icon-notepad" viewBox="0 0 32 32">
            <path fill="#000" d="M5 2h16l7 7v21H5z" />
            <path fill="#fff" d="M6 3h14l6 6v20H6z" />
            <path fill="#808080" d="M20 3v6h6z" />
            <path fill="#e0e0e0" d="M20 4v5h5z" />
            <path fill="#000080" d="M9 12h14v1H9zM9 16h12v1H9zM9 20h14v1H9zM9 24h9v1H9z" />
        </symbol>
        <symbol id="icon-terminal" viewBox="0 0 32 32">
            <path fill="#000" d="M2 4h28v24H2z" />
            <path fill="#c0c0c0" d="M3 5h26v22H3z" />
            <path fill="#000" d="M4 6h24v18H4z" />
            <path fill="050505" d="M5 7h22v16H5z" />
            <path fill="none" stroke="#33ff66" stroke-width="2" d="M8 11l4 3-4 3" />
            <path fill="none" stroke="#33ff66" stroke-width="2" d="M15 17h6" />
            <path fill="#808080" d="M5 27h22v1H5" />
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 32 32">
            <path fill="#000" d="M13 2h6v4h4v3h3v4h4v6h-4v4h-3v3h-4v4h-6v-4H9v-3H6v-4H2v-6h4V9h3v6h4z" />
            <path fill="#c0c0c0" d="M14 3h4v4h4v3h3v4h4v4h-4v4h-3v3h-4v4h-4v-4H10v-3H7v-4H3v-4h4V9h3V6h4z" />
            <path fill="#000" d="M12 12h8v8h-8z" />
            <path fill="#008080" d="M14 14h4v4h-4z" />
            <path fill="#fff" opacity=".4" d="M136v1h-6z" />
        </symbol>
        <symbol id="icon-info" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" fill="#000" />
            <circle cx="16" cy="16" r="12" fill="#000080" />
            <rect x="14" y="13" width="4" height="11" fill="#fff" />
            <rect x="14" y="7" width="4" height="4" fill="#fff" />
            <path fill="#1084d0" d="M6 9a12 12 0 0 1 9-6v5z" />
        </symbol>
        <symbol id="icon-windows" viewBox="0 0 32 32">
            <path fill="#000" d="M2 6h20v16H2z" />
            <path fill="#c0c0c0" d="M3 7h18v14H3z" />
            <path fill="#000080" d="M4 8h16v4H4z" />
            <path fill="#000" d="M10 12h20v16H10z" />
            <path fill="#c0c0c0" d="M12 14h16v4H12z" />
        </symbol>
        <symbol id="icon-close" viewBox="0 0 8 8">
            <path d="M1 1l6 6M7 1L1 7" stroke="currentColor" stroke-width="2" stroke-linecap="square" />
        </symbol>
        <symbol id="icon-minimize" viewBox="0 0 8 8">
            <path d="M1 6h6v1H1z" fill="currentColor" />
        </symbol>
        <symbol id="icon-maximize" viewBox="0 0 8 8">
            <path d="M1 1h6v6H1z" fill="none" stroke="currentColor" />
            <path d="M3 1h4v4" fill="none" stroke="currentColor" />
        </symbol>
    </svg>
    <div id="boot-screen" class="boot-screen" role="status">
        <div class="boot-card">
            <svg class="boot-logo" aria-hidden="true">
                <use href="icon-logo"></use>
            </svg>
            <h1>PixelDesk95</h1>
            <p class="boot-subtitles">A small WebOS for your browser</p>
            <div class="boot-progress" aria-hidden="true">
                <div class="boot-progress-fill"></div>
                <div class="boot-progression" aria-hidden="true">
                    <div class="boot-progress-fill"></div>
                </div>
                <p class="boot-status">starting&hellip;click to skip</p>
            </div>
        </div>
        <main id="desktop" class="desktop" aria-label="PixelDesk Desktop">
            <div id="desktop-icons" class="desktop-icons"></div>
            <div id="window-layer" class="window-layer"></div>
        </main>
        <footer class="taskbar">
            <button id="start-button" class="start-button" type="button" aria-haspopup="menu" aria-expanded="false"
                aria-controls="start-menu">
                <svg class="start-logo" aria-hidden="true">
                    <use href="icon-logo"></use>
                </svg>
                <span>Start</span>
            </button>
            <div class="taskbar-buttons" class="task-buttons" role="toolbar" aria-label="open windows"></div>
            <div class="tray">
                <time id="clock" class="clock">--:--</time>
            </div>
        </footer>
        <div id="start-menu" class="start-menu" role="menu" aria-label="start-menu" hidden>
            <div class="start-banner" aria-hidden="true"><span>PixelDesk95</span></div>
            <div id="start-items" class="start-items"></div>
        </div>
        <template id="window-template">
            <section class="window" tabindex="-1" role="dialog">
                <header class="titlebar">
                    <svg class="titlebar-icons" aria-hidden="true">
                        <use></use>
                    </svg>
                    <span class="titlebar-title"></span>
                    <div class="window-control">
                        <button class="window-control" type="button" data-action="minimize" title="Minimize"
                            aria-label="Minimize">
                            <svg aria-hidden="true">
                                <use href="icon-minimize"></use>
                            </svg>
                        </button>
                        <button class="window-control" type="button" data-action="maximize" title="Maximize"
                            aria-label="Maximize">
                            <svg aria-hidden="true">
                                <use href="icon-maximize"></use>
                            </svg>

                        </button>
                        <button class="window-control" type="button" data-action="close" title="Close"
                            aria-label="Close">
                            <svg aria-hidden="true">
                                <use href="icon-close"></use>
                            </svg>
                        </button>
                    </div>
                </header>
                <div class="window-body"></div>
            </section>
        </template>
        <script src="app.js" defer></script>

</body>

</html>
